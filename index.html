<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image → G-code Plotter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Image → G-code Plotter (client-side)</h1>

    <section id="controls">
      <label>Choose image:
        <input id="file" type="file" accept="image/*" />
      </label>

      <div class="row">
        <label>Target width (mm):
          <input id="widthMm" type="number" value="100" min="1" step="1" />
        </label>

        <label>Step (mm per pixel):
          <input id="stepMm" type="number" value="0.5" min="0.05" step="0.05" />
        </label>

        <label>Threshold (0-255):
          <input id="threshold" type="number" value="128" min="0" max="255" />
        </label>

        <label>
          <input id="invert" type="checkbox" /> Invert (draw light areas)
        </label>
      </div>

      <div class="row">
        <label>Feed rate (mm/min):
          <input id="feed" type="number" value="1500" min="1" />
        </label>

        <label>Pen up Z (mm):
          <input id="penUp" type="number" value="5" step="0.1" />
        </label>

        <label>Pen down Z (mm):
          <input id="penDown" type="number" value="0" step="0.1" />
        </label>

        <label>Alternate scan (serpentine):
          <input id="serpentine" type="checkbox" checked />
        </label>
      </div>

      <div class="row">
        <button id="generate">Generate G-code</button>
        <button id="download" disabled>Download G-code</button>
        <button id="clear">Clear</button>
      </div>
    </section>

    <section id="outputs">
      <div class="column">
        <h2>G-code</h2>
        <textarea id="gcode" readonly></textarea>
      </div>

      <div class="column">
        <h2>Preview (black & white)</h2>
        <canvas id="preview" width="400" height="300"></canvas>
      </div>
    </section>

    <footer>
      <small>Client-side only. Works in modern browsers.</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
