<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image → G-code Plotter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>Image → G-code Plotter</h1>

    <section class="card controls">
      <label class="file">
        Select image
        <input id="file" type="file" accept="image/*" />
      </label>

      <div class="row">
        <label>
          Max width (mm)
          <input id="maxWidthMm" type="number" value="150" min="1" />
        </label>

        <label>
          mm / pixel
          <input id="mmPerPixel" type="number" value="0.5" step="0.01" min="0.01" />
        </label>

        <label>
          Feed (mm/min)
          <input id="feedRate" type="number" value="1200" min="1" />
        </label>
      </div>

      <div class="row small">
        <label><input id="dither" type="checkbox" /> Floyd–Steinberg dither</label>
        <label><input id="invert" type="checkbox" /> Invert (black ↔ white)</label>
        <label><input id="serpentine" type="checkbox" checked /> Serpentine scan</label>
      </div>

      <div class="row">
        <label>
          Pen down command
          <input id="penDownCmd" type="text" value="G1 Z0.000" />
        </label>

        <label>
          Pen up command
          <input id="penUpCmd" type="text" value="G1 Z5.000" />
        </label>
      </div>

      <div class="actions">
        <button id="generate">Generate G-code</button>
        <a id="download" class="button hidden" href="#" download="image_plot.gcode">Download G-code</a>
        <button id="clear" class="muted">Clear</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="card outputs">
      <h2>G-code</h2>
      <pre id="gcode" class="gcode" spellcheck="false"></pre>
      <div class="gcode-actions">
        <button id="copyG">Copy G-code</button>
      </div>

      <h2 style="margin-top:18px">Black & White Preview (used to generate the G-code)</h2>
      <canvas id="preview" class="preview" width="800" height="400"></canvas>
    </section>

    <footer class="foot">
      Generates simple raster (row-by-row) G-code suitable for pen/plotters. Adjust commands to match your machine.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
